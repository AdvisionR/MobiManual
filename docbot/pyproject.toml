[project]
name = "docbot"
version = "0.1.0"
description = "MobiManual DocBot — merge-request doc-impact gate and screenshot staleness detector"
requires-python = ">=3.11"

# Deliberately small. Foundation doc §8.5 wants a CLI that runs identically on a
# laptop and in CI, so every dependency here has to earn a place in the image.
#   httpx  — model provider calls. Used instead of a vendor SDK so the provider
#            interface (§10, "keep the provider behind a thin interface") stays
#            honest and swapping vendors is a new file, not a new dependency.
#   pyyaml — the doc map (§6.5) is YAML.
#   click  — CLI (§9).
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
docbot = "docbot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
