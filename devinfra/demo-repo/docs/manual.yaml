# Chapter order for the MobiVisor user manual.
#
# The order lives here rather than in the heading text. Foundation doc §4
# defect 1: the real manual writes `CHAPTER 5: POLICIES` into the heading, so
# inserting a chapter invalidates every later heading, anchor and
# cross-reference — and an agent asked to edit "chapter 6" edits the wrong one.
#
# The build numbers chapters from this list. Moving a chapter is a one-line
# diff and no anchor changes.

title: MobiVisor User Manual
language: en          # §2: English only, no localisation in scope
version: "4.2"

chapters:
  - pages/intro/general.md
  - pages/intro/security.md
  - pages/users.md
  - pages/roles.md
  - pages/enrollment/ios-abm.md
  - pages/policies/kiosk-modes.md
  - pages/reference/policy-settings.md
