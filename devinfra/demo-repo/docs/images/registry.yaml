# Orphan screenshot registry — foundation doc §5.1.
#
# ~60% of the manual's screenshots are already produced by the E2E suite and
# named `<spec file>-<test name>.png`. Those need no registry: the filename
# says which test captures them, so staleness is deterministic (§5).
#
# This file is for the other ~40% — hand-captured images with ad-hoc names and
# no test behind them. Without an entry, nothing in the pipeline knows what a
# hand-captured image renders, so nothing can tell when it goes stale.
#
# `docbot screenshots audit --registry images/registry.yaml` fails on any
# orphan that has no entry here. §5.1: without that lint the registry rots
# within two releases.
#
# The better fix for any line in this file is to delete it — by writing an E2E
# test that captures the same screen. §5.1 treats "manual screenshot with no
# E2E test" as a backlog item, because every conversion improves the manual and
# the test suite at once.
#
# The entries below are real orphan filenames from the shipped manual, listed
# here to show the shape. The image files themselves are not in this fixture.
#
# Paths are repo-root-relative, because this file crosses the code/docs
# boundary: `renders` names source files and `pages` names manual pages. The
# convention for the monorepo is in ../README.md — anything that spans both
# halves is root-relative, anything purely inside docs/ (manual.yaml, the
# image links in the Markdown) stays docs-relative.

- file: docs/images/_ldapSettings_1.png
  renders: ["src/console/settings/LdapSettings.tsx"]
  pages: ["docs/pages/users.md"]
  captured: "2025-11-14"
  version: "4.2"

- file: docs/images/_samsung_kiosk_Mode_1.png
  renders: ["src/console/kiosk/SamsungKioskForm.tsx"]
  pages: ["docs/pages/policies/kiosk-modes.md"]
  captured: "2025-11-14"
  version: "4.2"

- file: docs/images/_enrollment_wizard_1.png
  renders: ["src/enrollment/ios/EnrollmentWizard.tsx"]
  pages: ["docs/pages/enrollment/ios-abm.md"]
  captured: "2025-11-14"
  version: "4.2"
