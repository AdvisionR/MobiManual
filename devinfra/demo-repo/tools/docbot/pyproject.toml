[project]
name = "docbot"
version = "0.1.0"
description = "Keeps the MobiVisor user manual in step with what merges to main."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.27",
  "httpx2>=2.13",
  "mistralai>=3.0",
]

[project.scripts]
docbot = "docbot.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# On top of ruff's defaults: rules this codebase has chosen to follow.
[tool.ruff.lint]
extend-select = [
  "E731",   # assign a def, not a lambda
  "PT018",  # one condition per assert, so pytest shows which one failed
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
markers = ["live: calls the real model provider and costs credits; run with -m live"]
addopts = "-m 'not live'"
