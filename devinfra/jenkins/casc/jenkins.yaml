# Jenkins Configuration as Code — applied at boot, so the controller can be
# rebuilt from scratch at any time. Secrets come from the environment
# (docker-compose.yml + .runtime/gitlab.env), never from this file.
#
# The symbol names were read back from a running instance via
# POST /configuration-as-code/export, not guessed. Several are not the obvious
# spelling — `loggedInUsersCanDoAnything`, and `gitlabPersonalAccessToken`
# (lowercase "l") next to `gitLabServers` (capital "L"). A wrong symbol
# crash-loops Jenkins at boot, so re-verify the same way after a plugin upgrade.

jenkins:
  systemMessage: |
    DocBot template — local GitLab + Jenkins.
    GitLab: http://gitlab.orb.local   Jenkins: http://jenkins.orb.local:8080
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy: "loggedInUsersCanDoAnything"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Used by the Branch Source plugin: merge request discovery and
          # webhook registration.
          - gitlabPersonalAccessToken:
              scope: GLOBAL
              id: "gitlab-pat"
              description: "GitLab PAT (root) — MR discovery + webhook management"
              token: "${GITLAB_PAT}"
          # Same secret as a username/password pair, which is what the
          # Jenkinsfile binds to hand the bot a token.
          - usernamePassword:
              scope: GLOBAL
              id: "gitlab-http"
              description: "GitLab HTTP credentials — used by the pipeline"
              username: "root"
              password: "${GITLAB_PAT}"

unclassified:
  location:
    # Must be an address GitLab can reach: the Branch Source plugin derives the
    # webhook callback URL from it. jenkins.orb.local resolves from inside the
    # GitLab container as well as from the browser.
    url: "${JENKINS_URL_EXTERNAL}"
    adminAddress: "docbot@mobimanual.local"

  gitLabServers:
    servers:
      - name: "local-gitlab"
        serverUrl: "${GITLAB_SERVER_URL}"
        credentialsId: "gitlab-pat"
        # Jenkins registers and maintains the project webhook itself, and this
        # flag is the only thing gating it: GitLabHookCreator.register() opens
        # its default (SYSTEM) branch with `if (!server.isManageWebHooks())
        # return;`. With it false, registration returns before it ever looks at
        # a credential — silently, no log line, and no merge request is ever
        # detected. See README §6.3.
        manageWebHooks: true
        # System hooks are instance-wide and need an admin-scoped token. The
        # project webhook is all detection requires.
        manageSystemHooks: false
